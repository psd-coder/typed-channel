<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worker requests — typed-channel</title>
  </head>
  <body>
    <h1>Worker requests example</h1>
    <p>
      The page sends a <code>compute</code> request to the worker. Before it starts, the worker
      sends a <code>confirm</code> request back to the page. Decline the confirm to see the thrown
      error, or press Abort while it runs.
    </p>
    <button id="compute">Compute</button>
    <button id="abort">Abort</button>
    <div id="log"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
